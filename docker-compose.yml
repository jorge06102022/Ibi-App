version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: connectvoice_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  web:
    build: .
    container_name: connectvoice_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=*
      - SECRET_KEY=cambia-esta-clave-en-produccion
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    volumes:
      - sqlite_data:/app/db_data

volumes:
  redis_data:
  sqlite_data:

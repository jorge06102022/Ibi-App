{% extends "base.html" %}
{% load static %}
{% block title %}IBI — Comunicación sin barreras{% endblock %}

{% block extra_css %}
<style>
  .welcome-wrap{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px 16px;
    background:var(--bg0);
  }
  .welcome-hero{
    position:relative;
    width:100%;
    max-width:420px;
    aspect-ratio: 539 / 1019;
    border-radius:var(--r4);
    overflow:hidden;
    box-shadow:var(--sh3);
  }
  .welcome-hero img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .welcome-cta{
    position:absolute;
    left:50%; bottom:6%;
    transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:10px;
    text-decoration:none;
    width:70%;
  }
  .welcome-cta-circle{
    width:34%;
    aspect-ratio:1/1;
    border-radius:50%;
    background:linear-gradient(160deg,#38bdf8,#0ea5e9 55%, #0369a1);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 6px rgba(0,212,255,.12), 0 10px 40px rgba(0,0,0,.45);
    font-size:clamp(24px, 8vw, 34px);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .welcome-cta:hover .welcome-cta-circle{
    transform:scale(1.06);
    box-shadow:0 0 0 10px rgba(0,212,255,.18), 0 10px 40px rgba(0,0,0,.5);
  }
  .welcome-cta-text{ text-align:center; }
  .welcome-cta-text b{
    display:block; color:#fff; font-size:clamp(12px, 3.4vw, 15px);
    letter-spacing:.6px; text-shadow:0 2px 8px rgba(0,0,0,.6);
  }
  .welcome-cta-text span{
    display:block; color:rgba(255,255,255,.75); font-size:clamp(10px, 2.6vw, 12px);
    margin-top:2px; text-shadow:0 2px 8px rgba(0,0,0,.6);
  }
</style>
{% endblock %}

{% block body %}
<div class="welcome-wrap">
  <div class="welcome-hero">
    <img src="{% static 'chat/img/welcome-hero.jpg' %}" alt="IBI — Comunicación Sin Barreras">

    <a href="{% url 'chat:index' %}" class="welcome-cta">
      <div class="welcome-cta-circle">
        <img src="{% static 'chat/img/logo.png' %}" alt="Logo Ibi" style="width: 60%; height: auto; mix-blend-mode: multiply;">
      </div>
      <div class="welcome-cta-text">
        <b>EMPEZAR CONVERSACIÓN</b>
        <span>Toque para conectar</span>
      </div>
    </a>
  </div>
</div>
{% endblock %}

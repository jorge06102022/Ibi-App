name: ibi_app
description: "ibi — app nativa Android (chat + voz)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  web_socket_channel: ^2.4.0
  speech_to_text: ^7.3.0
  flutter_tts: ^4.0.2
  shared_preferences: ^2.2.2
  uuid: ^4.4.0
  google_fonts: ^6.2.1
  webview_flutter: ^4.7.0

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/html/
    - assets/lsc/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.png"
